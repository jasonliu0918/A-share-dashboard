name: Update Amt3d

on:
  # 收盘后跑：15:00 CST 收盘。多个错开的时点提高成功率（东财对境外 IP 偶发限流，
  # 只要有一次成功即更新；失败会保留既有数据、软退出不标红）。cron 用 UTC。
  schedule:
    - cron: "30 9 * * 1-5"   # 17:30 Asia/Shanghai
    - cron: "30 10 * * 1-5"  # 18:30 Asia/Shanghai
    - cron: "30 12 * * 1-5"  # 20:30 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-amt3d
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate amt3d
        run: python scripts/update_amt3d.py

      - name: Commit updated data
        run: |
          git add assets/amt3d.js
          if git diff --cached --quiet; then
            echo "No amt3d change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update amt3d (近3日成交额)"
          git push
